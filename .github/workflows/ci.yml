name: ci
on: [push, pull_request]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # torch lives in the cuda extra; without it 15 test modules fail at import and
      # collection dies before a single test runs.
      - run: uv sync --extra dev --extra cuda --extra export --extra api
      - name: lint
        run: uv run ruff check src tests
      - name: tests
        # Tests needing data/raw are skipped on CI; raw data is never committed.
        run: uv run pytest -q -m "not gpu"
